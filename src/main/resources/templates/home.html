<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home - Meu Ritmo</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('/images/fundo3.jpg');
            background-repeat: repeat;
            background-size: 1000px;
            opacity: 0.4;
            z-index: -1;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            color: #003087;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-sair {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 20px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sair:hover { background: #f5f5f5; }

        /* MAIN */
        .main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

        .page-title {
            color: #003087;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .page-subtitle {
            color: #7a8bad;
            font-size: 15px;
            margin-bottom: 24px;
        }

        /* BOTÕES DE AÇÃO */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: #f5a623;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            padding: 13px 24px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover { background: #e09415; }

        /* CARDS DE USUÁRIO */
        .usuario-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-admin {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            /*display: flex;*/
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .usuario-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .usuario-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .avatar-azul { background: #d0f0ff; }
        .avatar-rosa { background: #ffd6ea; }
        .avatar-verde { background: #d0f5e8; }
        .avatar-amarelo { background: #fff3cc; }

        .usuario-info { flex: 1; }

        .usuario-email {
            color: #1a1a2e;
            font-size: 15px;
            font-weight: 600;
        }

        .usuario-role {
            color: #7a8bad;
            font-size: 13px;
        }

        .usuario-arrow {
            color: #aaa;
            font-size: 18px;
        }

        /* 3 COLUNAS DE ATIVIDADES */
        .colunas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .coluna {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            overflow: hidden;
        }

        .coluna-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            margin: 10px 10px 0;
        }

        .coluna-titulo {
            color: white;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coluna-count {
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .bg-manha { background: #f5a623; }
        .bg-tarde { background: #00aeef; }
        .bg-noite { background: #003087; }

        .coluna-body { padding: 10px; }

        /* CARD DE ATIVIDADE */
        .atividade-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .atividade-card.concluida { opacity: 0.65; }

        .atividade-nome {
            color: #1a1a2e;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .atividade-card.concluida .atividade-nome {
            text-decoration: line-through;
            color: #999;
        }

        .atividade-hora {
            color: #7a8bad;
            font-size: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-concluir {
            background: #a8e6cf;
            border: none;
            border-radius: 20px;
            color: #2d6a4f;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-concluir:hover { background: #74c69d; }

        .badge-concluida {
            background: #a8e6cf;
            color: #2d6a4f;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .sem-atividades {
            color: #bbb;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .colunas { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <a href="/home" class="header-logo">🧩 Meu Ritmo</a>
    <a href="/logout" class="btn-sair">↪ Sair</a>
</div>

<div class="main">

    <!-- HOME DO ADMIN -->
    <div th:if="${usuarioLogado.role.name() == 'ADMIN'}" class="card-admin" >
        <p class="page-title">Olá, Administrador!</p>

        <h5><p class="page-subtitle">Gerencie os usuários e crie novas atividades.</p></h5>

        <div class="action-buttons">
            <a href="/usuario/novo" class="btn-action">👤 Novo Usuário</a>
            <a href="/atividades/nova" class="btn-action">+ Nova Atividade</a>
        </div>
    </div>

        <div th:each="u, stat : ${usuarios}">
            <a th:href="@{/atividades/usuario/{id}(id=${u.id})}" class="usuario-card">
                <div class="usuario-avatar"
                     th:classappend="${stat.index % 4 == 0} ? 'avatar-azul' :
                                         (${stat.index % 4 == 1} ? 'avatar-rosa' :
                                         (${stat.index % 4 == 2} ? 'avatar-verde' : 'avatar-amarelo'))">
                    😊
                </div>
                <div class="usuario-info">
                    <div class="usuario-email" th:text="${u.email}"></div>
                    <div class="usuario-role">Usuário</div>
                </div>
                <span class="usuario-arrow">›</span>
            </a>
        </div>


    <!-- HOME DO USER -->
    <div th:if="${usuarioLogado.role.name() == 'USUARIO'}">
        <p class="page-title">Minhas atividades de hoje</p>
        <p class="page-subtitle" th:text="'Olá, ' + ${usuarioLogado.email} + '!'"></p>

        <div class="colunas">

            <!-- MANHÃ -->
            <div class="coluna">
                <div class="coluna-header bg-manha">
                    <span class="coluna-titulo">🌅 Manhã</span>
                    <span class="coluna-count" th:text="${#lists.size(manha)}">0</span>
                </div>
                <div class="coluna-body">
                    <div th:each="a : ${manha}"
                         th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                        <div class="atividade-nome" th:text="${a.nome}"></div>
                        <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                        <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                        <form th:if="${!a.concluida}"
                              th:action="@{/atividades/concluir/{id}(id=${a.id})}" method="post">
                            <button type="submit" class="btn-concluir">✔ Concluir</button>
                        </form>
                    </div>
                    <p th:if="${#lists.isEmpty(manha)}" class="sem-atividades">Nenhuma atividade</p>
                </div>
            </div>

            <!-- TARDE -->
            <div class="coluna">
                <div class="coluna-header bg-tarde">
                    <span class="coluna-titulo">☀️ Tarde</span>
                    <span class="coluna-count" th:text="${#lists.size(tarde)}">0</span>
                </div>
                <div class="coluna-body">
                    <div th:each="a : ${tarde}"
                         th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                        <div class="atividade-nome" th:text="${a.nome}"></div>
                        <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                        <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                        <form th:if="${!a.concluida}"
                              th:action="@{/atividades/concluir/{id}(id=${a.id})}" method="post">
                            <button type="submit" class="btn-concluir">✔ Concluir</button>
                        </form>
                    </div>
                    <p th:if="${#lists.isEmpty(tarde)}" class="sem-atividades">Nenhuma atividade</p>
                </div>
            </div>

            <!-- NOITE -->
            <div class="coluna">
                <div class="coluna-header bg-noite">
                    <span class="coluna-titulo">🌙 Noite</span>
                    <span class="coluna-count" th:text="${#lists.size(noite)}">0</span>
                </div>
                <div class="coluna-body">
                    <div th:each="a : ${noite}"
                         th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                        <div class="atividade-nome" th:text="${a.nome}"></div>
                        <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                        <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                        <form th:if="${!a.concluida}"
                              th:action="@{/atividades/concluir/{id}(id=${a.id})}" method="post">
                            <button type="submit" class="btn-concluir">✔ Concluir</button>
                        </form>
                    </div>
                    <p th:if="${#lists.isEmpty(noite)}" class="sem-atividades">Nenhuma atividade</p>
                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
