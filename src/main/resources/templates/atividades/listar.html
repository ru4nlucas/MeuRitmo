<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividades - Meu Ritmo</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('/images/fundo3.jpg');
            background-repeat: repeat;
            background-size: 1000px;
            opacity: 0.4;
            z-index: -1;
        }
        .card-admin {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            /*display: flex;*/
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .header {
            background: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            color: #003087;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-voltar {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 20px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-voltar:hover { background: #f5f5f5; }

        .btn-sair {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 20px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-sair:hover { background: #f5f5f5; }

        .main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

        .page-title {
            color: #003087;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #7a8bad;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-action {
            background: #f5a623;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .btn-action:hover { background: #e09415; }

        /* 3 COLUNAS */
        .colunas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .coluna {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            overflow: hidden;
        }

        .coluna-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 16px;
            margin: 10px 10px 0;
        }

        .coluna-titulo {
            color: white;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coluna-count {
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .bg-manha { background: #f5a623; }
        .bg-tarde { background: #00aeef; }
        .bg-noite { background: #003087; }

        .coluna-body { padding: 10px; }

        .atividade-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .atividade-card.concluida { opacity: 0.65; }

        .atividade-nome {
            color: #1a1a2e;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .atividade-card.concluida .atividade-nome {
            text-decoration: line-through;
            color: #999;
        }

        .atividade-hora {
            color: #7a8bad;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .acoes {
            display: flex;
            gap: 6px;
        }

        .btn-editar {
            background: #e8f4ff;
            border: none;
            border-radius: 10px;
            color: #00aeef;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
            text-align: center;
        }

        .btn-editar:hover { background: #d0eaff; }

        .btn-deletar {
            background: #fff0f5;
            border: none;
            border-radius: 10px;
            color: #e91e8c;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
            text-align: center;
        }

        .btn-deletar:hover { background: #ffd6ea; }

        .badge-concluida {
            background: #a8e6cf;
            color: #2d6a4f;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .sem-atividades {
            color: #bbb;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .colunas { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="/home" class="header-logo">🧩 Meu Ritmo</a>
    <div class="header-right">
        <a href="/home" class="btn-voltar">← Voltar</a>
        <a href="/logout" class="btn-sair">↪ Sair</a>
    </div>
</div>

<div class="main">
    <div class = "card-admin">
    <!-- TITULO -->
    <p class="page-title" th:text="'Atividades de ' + ${aluno.email}"></p>
    <p class="page-subtitle">Você está vendo as atividades deste usuário.</p>

    <!-- BOTÃO NOVA ATIVIDADE -->
    <a th:href="@{/atividades/nova}" class="btn-action">+ Nova Atividade</a>
    </div>
    <!-- 3 COLUNAS -->
    <div class="colunas">

        <!-- MANHÃ -->
        <div class="coluna">
            <div class="coluna-header bg-manha">
                <span class="coluna-titulo">🌅 Manhã</span>
                <span class="coluna-count" th:text="${#lists.size(manha)}">0</span>
            </div>
            <div class="coluna-body">
                <div th:each="a : ${manha}"
                     th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                    <div class="atividade-nome" th:text="${a.nome}"></div>
                    <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                    <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                    <div th:if="${!a.concluida}" class="acoes">
                        <a th:href="@{/atividades/editar/{id}(id=${a.id})}" class="btn-editar">✏ Editar</a>
                        <a th:href="@{/atividades/deletar/{nome}(nome=${a.nome})}" class="btn-deletar">🗑 Deletar</a>
                    </div>
                </div>
                <p th:if="${#lists.isEmpty(manha)}" class="sem-atividades">Nenhuma atividade</p>
            </div>
        </div>

        <!-- TARDE -->
        <div class="coluna">
            <div class="coluna-header bg-tarde">
                <span class="coluna-titulo">☀️ Tarde</span>
                <span class="coluna-count" th:text="${#lists.size(tarde)}">0</span>
            </div>
            <div class="coluna-body">
                <div th:each="a : ${tarde}"
                     th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                    <div class="atividade-nome" th:text="${a.nome}"></div>
                    <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                    <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                    <div th:if="${!a.concluida}" class="acoes">
                        <a th:href="@{/atividades/editar/{id}(id=${a.id})}" class="btn-editar">✏ Editar</a>
                        <a th:href="@{/atividades/deletar/{nome}(nome=${a.nome})}" class="btn-deletar">🗑 Deletar</a>
                    </div>
                </div>
                <p th:if="${#lists.isEmpty(tarde)}" class="sem-atividades">Nenhuma atividade</p>
            </div>
        </div>

        <!-- NOITE -->
        <div class="coluna">
            <div class="coluna-header bg-noite">
                <span class="coluna-titulo">🌙 Noite</span>
                <span class="coluna-count" th:text="${#lists.size(noite)}">0</span>
            </div>
            <div class="coluna-body">
                <div th:each="a : ${noite}"
                     th:class="${a.concluida} ? 'atividade-card concluida' : 'atividade-card'">
                    <div class="atividade-nome" th:text="${a.nome}"></div>
                    <div class="atividade-hora">🕐 <span th:text="${a.hora}"></span></div>
                    <span th:if="${a.concluida}" class="badge-concluida">✅ Concluída!</span>
                    <div th:if="${!a.concluida}" class="acoes">
                        <a th:href="@{/atividades/editar/{id}(id=${a.id})}" class="btn-editar">✏ Editar</a>
                        <a th:href="@{/atividades/deletar/{nome}(nome=${a.nome})}" class="btn-deletar">🗑 Deletar</a>
                    </div>
                </div>
                <p th:if="${#lists.isEmpty(noite)}" class="sem-atividades">Nenhuma atividade</p>
            </div>
        </div>

    </div>
</div>
</body>
</html>
