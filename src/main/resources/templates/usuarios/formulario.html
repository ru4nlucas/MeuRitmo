<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Usuário - Meu Ritmo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('/images/fundo3.jpg');
            background-repeat: repeat;
            background-size: 1000px;
            opacity: 0.4;
            z-index: -1;
        }

        .header {
            background: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            color: #003087;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
        }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .btn-voltar, .btn-sair {
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 20px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            text-decoration: none;
        }

        .btn-voltar:hover, .btn-sair:hover { background: #f5f5f5; }

        .main { padding: 28px 24px; max-width: 600px; margin: 0 auto; }

        .card-admin {
            background: white;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        .page-title {
            color: #003087;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .page-subtitle {
            color: #7a8bad;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: #f5f9ff;
            border: 2px solid #b3d9f5;
            border-radius: 12px;
            color: #333;
            font-size: 14px;
            padding: 11px 14px;
            margin-bottom: 18px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }

        input:focus { border-color: #00aeef; }

        .btn-salvar {
            width: 100%;
            background: #f5a623;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            padding: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-salvar:hover { background: #e09415; }

        .btn-cancelar {
            width: 100%;
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 24px;
            color: #555;
            font-size: 15px;
            font-weight: 600;
            padding: 13px;
            text-decoration: none;
            text-align: center;
            display: block;
            margin-top: 10px;
        }

        .btn-cancelar:hover { background: #f5f5f5; }
    </style>
</head>
<body>

<div class="header">
    <a href="/home" class="header-logo">🧩 Meu Ritmo</a>
    <div class="header-right">
        <a href="/home" class="btn-voltar">← Voltar</a>
        <a href="/logout" class="btn-sair">↪ Sair</a>
    </div>
</div>

<div class="main">
    <div class="card-admin">
        <p class="page-title" th:text="${usuario.id != null} ? 'Editar Usuário' : 'Novo Usuário'"></p>
        <p class="page-subtitle">Crie a conta de um usuário com email e senha.</p>

        <form th:action="${usuario.id != null} ? '/usuario/atualizar' : '/usuario/salvar'"
              th:object="${usuario}" method="post">

            <input type="hidden" th:if="${usuario.id != null}" th:field="*{id}" />

            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="email@exemplo.com" required />

            <label>Senha</label>
            <input type="text" th:field="*{senha}" placeholder="Senha da conta" required />

            <button type="submit" class="btn-salvar"
                    th:text="${usuario.id != null} ? 'Salvar alterações' : 'Criar usuário'">
            </button>
        </form>

        <a href="/home" class="btn-cancelar">Cancelar</a>
    </div>
</div>

</body>
</html>
